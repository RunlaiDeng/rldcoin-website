	<title>Rldcoin: issuance strands</title>
	<desc>Twenty-one million RLD is conserved across disjoint slot intervals from 4096 budget roots. Stable-generation claims detach bounded unconsumed ranges. Mint cursors advance independently; exported ranges do not change.</desc>
